name: agentic-ai-offensive-security-lab

services:
  postgres:
    profiles: [artex]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [training]
    restart: unless-stopped

  artex:
    profiles: [artex]
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-v0.3.15-global.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:?Copy .env.example to .env and set ARTEX_ADMIN_PASSWORD}
      ARTEX_LANG: ${ARTEX_LANG:-ko}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./runtime/artex-data:/app/data
      - ./runtime/artex-skills:/app/skills
    networks: [training]
    restart: unless-stopped

  artex-classroom-init:
    profiles: [artex]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      artex:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./artex/classroom/agents-ko.sql:/seed/classroom.sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        until psql -h postgres -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex} -Atc "select to_regclass('public.agents')" | grep -q agents; do
          sleep 1
        done
        psql -h postgres -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex} -f /seed/classroom.sql
    networks: [training]
    restart: "no"

  cve-mcp:
    profiles: [mcp]
    build:
      context: ./mcp/cve-mcp-server
    image: ai-security-classroom/cve-mcp:0.2.0
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
      REQUEST_TIMEOUT: "30"
      MAX_RETRIES: "3"
      CACHE_DB_PATH: /tmp/cve-mcp/cache.db
      AUDIT_LOG_PATH: /tmp/cve-mcp/audit.log
      MCP_ALLOWED_HOSTS: cve-mcp:*,127.0.0.1:*,localhost:*
    ports:
      - "127.0.0.1:8800:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [training]
    restart: unless-stopped

  "3100":
    profiles: [foundation]
    build:
      context: ./labs/3100
    image: ai-security-classroom/lab-3100:0.1.0
    ports:
      - "127.0.0.1:3100:8080"
    networks:
      training:
        aliases: [portal.digitaltrust.lab]
    restart: unless-stopped

  "3101":
    profiles: [guided]
    build:
      context: ./labs/3101
    image: ai-security-classroom/lab-3101:0.1.0
    environment:
      LAB_DB_PATH: /tmp/lab-3101.db
    ports:
      - "127.0.0.1:3101:8080"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      training:
        aliases: [rail.korail.lab]
    restart: unless-stopped

  "3102":
    profiles: [guided]
    build:
      context: ./labs/3102
    image: ai-security-classroom/lab-3102:0.1.0
    environment:
      LAB_MODE: xss
    ports:
      - "127.0.0.1:3102:8080"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      training:
        aliases: [research.nrf.lab]
    restart: unless-stopped

  "3103":
    profiles: [guided]
    build:
      context: ./labs/3103
    image: ai-security-classroom/lab-3103:0.1.0
    environment:
      LAB_MODE: idor
    ports:
      - "127.0.0.1:3103:8080"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      training:
        aliases: [workorder.kogas-tech.lab]
    restart: unless-stopped

  "3104":
    profiles: [guided]
    build:
      context: ./labs/3104
    image: ai-security-classroom/lab-3104:0.1.0
    ports:
      - "127.0.0.1:3104:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run/apache2:rw,nosuid,size=4m
      - /var/lock/apache2:rw,nosuid,size=4m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      training:
        aliases: [customs.kcs.lab]
    restart: unless-stopped

  "3105":
    profiles: [final]
    build:
      context: ./labs/3105
    image: ai-security-classroom/lab-3105:0.1.0
    ports:
      - "127.0.0.1:3105:8080"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      training:
        aliases: [nris.research.lab]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  training:
    name: ai-security-training

